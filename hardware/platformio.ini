[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM11
monitor_port = COM11
upload_speed = 115200
monitor_speed = 115200

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
