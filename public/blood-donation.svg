<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F6F8FA"/>
  <!-- Blood bag -->
  <rect x="150" y="70" width="100" height="140" rx="20" fill="#FFFFFF" stroke="#D8DFE6" stroke-width="4"/>
  <rect x="160" y="110" width="80" height="90" rx="12" fill="#C8102E"/>
  <!-- Tube -->
  <path d="M200 210 V250 C200 270 280 270 280 230" stroke="#C8102E" stroke-width="5" stroke-linecap="round"/>
  <!-- Top hanger -->
  <rect x="180" y="55" width="40" height="15" rx="4" fill="#D8DFE6"/>
  <circle cx="200" cy="62" r="4" fill="#12263F"/>
  <!-- Label -->
  <rect x="170" y="80" width="60" height="20" rx="4" fill="#12263F"/>
  <text x="200" y="94" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">O NEGATIVE</text>
  <!-- Drop -->
  <path d="M200 130 C190 145 185 155 185 165 C185 175 192 180 200 180 C208 180 215 175 215 165 C215 155 210 145 200 130 Z" fill="#FFFFFF"/>
  <text x="200" y="275" fill="#12263F" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VOLUNTARY DONATION</text>
</svg>
